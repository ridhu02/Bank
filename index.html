<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Smart Bank</title>

<style>
/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* ================================
   BODY
================================ */

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* ================================
   MAIN CONTAINER
   Normal pages = 420px
================================ */

.container{
    width:420px;
    max-width:95%;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}


/* ================================
   ONLY TRANSACTION HISTORY BIG
================================ */

.container:has(#history.active){
    width:95%;
    max-width:1200px;
}


/* ================================
   PAGES
================================ */

.page{
    display:none;
}

.active{
    display:block;
}


/* ================================
   HEADINGS
================================ */

h2{
    text-align:center;
    color:#1e3c72;
    margin-bottom:20px;
}


/* ================================
   INPUTS
================================ */

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}


/* ================================
   BUTTONS
================================ */

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e3c72;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2a5298;
}


/* ================================
   GREEN BUTTON
================================ */

.linkBtn{
    background:#28a745;
}

.linkBtn:hover{
    background:#1f8b39;
}


/* ================================
   BALANCE CARD
================================ */

.card{
    background:#1e3c72;
    color:white;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
    text-align:center;
}


/* ================================
   TRANSACTION HISTORY
================================ */

#history{
    width:100%;
}

#historyData{
    width:100%;

    /* 4 TRANSACTIONS IN ONE ROW */
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:15px;
}


/* ================================
   EACH TRANSACTION BOX
================================ */

#historyData .transaction{
    width:100%;
    background:#f2f2f2;
    padding:15px;
    margin:0;
    border-radius:8px;
    line-height:25px;

    display:block;

    border:1px solid #e0e0e0;
}


/* ================================
   TRANSACTION TITLE
================================ */

.transaction .transaction-title{
    font-weight:bold;
    font-size:17px;
    color:#1e3c72;

    border-bottom:1px solid #ddd;

    padding-bottom:7px;
    margin-bottom:10px;
}


/* ================================
   QR SCANNER
================================ */

#reader{
    width:100%;
    max-width:350px;
    margin:15px auto;
    overflow:hidden;
    border-radius:12px;
}

#reader video{
    width:100% !important;
    border-radius:12px;
}


/* ================================
   SCAN RESULT
================================ */

#scanResult{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
    color:#1e3c72;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        width:95%;
        max-width:95%;
        padding:15px;
    }

    /* History still bigger than normal content */
    .container:has(#history.active){
        width:95%;
        max-width:95%;
    }

    /* 2 TRANSACTION BOXES PER ROW */
    #historyData{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    #historyData .transaction{
        padding:12px;
        font-size:14px;
    }

}


/* ================================
   VERY SMALL MOBILE
================================ */

@media(max-width:400px){

    #historyData{
        grid-template-columns:1fr;
    }

}

/* ================================
   QR CODE
================================ */

.qr-box{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.qr-box img{
    width:300px;
    max-width:100%;
    height:auto;
    display:block;
    border-radius:8px;
}
</style>
</head>

<input
id="depositAmount"
type="number"
placeholder="Enter Amount">

<button onclick="deposit()">
Deposit
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- WITHDRAW -->

<div id="withdraw" class="page">

<h2>Withdraw Money</h2>

<input
id="withdrawAmount"
type="number"
placeholder="Enter Amount">

<button onclick="withdraw()">
Withdraw
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- TRANSFER -->

<div id="transfer" class="page">

<h2>Transfer Money</h2>

<input
id="receiver"
placeholder="Receiver Username">

<input
id="transferAmount"
type="number"
placeholder="Enter Amount">

<button onclick="transfer()">
Send Money
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- HISTORY -->

<div id="history" class="page">

<h2>Transaction History</h2>

<div id="historyData"></div>

<button onclick="show('dashboard')">
Back
</button>

</div>

</div>

.classList.add("active");

update();

if(id=="history"){
loadHistory();
}

}

// CREATE ACCOUNT
function signup(){

show("signup");

}



function createAccount(){


let username =
document.getElementById("newUsername").value;


let password =
document.getElementById("newPassword").value;


let phone =
document.getElementById("newPhone").value;


let email =
document.getElementById("newEmail").value;


let balance =
Number(document.getElementById("newBalance").value);



if(
!username ||
!password ||
!phone ||
!email ||
isNaN(balance) ||
balance < 0
){

alert("Please Fill All Details");
return;

}



let users =
JSON.parse(localStorage.getItem("users")) || [];



if(users.find(u=>u.username==username)){

alert("Username Already Exists");
return;

}



users.push({

username,
password,
phone,
email,
balance,

transactions:[]

});



localStorage.setItem(
"users",
JSON.stringify(users)
);



alert("Account Created Successfully");


// clear form

document.getElementById("newUsername").value="";
document.getElementById("newPassword").value="";
document.getElementById("newPhone").value="";
document.getElementById("newEmail").value="";
document.getElementById("newBalance").value="";


show("login");


}
// LOGIN
function login(){

    let username = document.getElementById("user").value;
    //let phone = document.getElementById("phone").value;
    // let email = document.getElementById("email").value;
    let password = document.getElementById("pass").value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(u =>
        u.username === username &&
        // u.phone === phone &&
        // u.email === email &&
        u.password === password
    );

    if(user){

        currentUser = username;

        localStorage.setItem("currentUser", username);

        // Inputs clear
        document.getElementById("user").value = "";
        // document.getElementById("phone").value = "";
        // document.getElementById("email").value = "";
        document.getElementById("pass").value = "";

        show("dashboard");

    }else{

        alert("Invalid details.");

    }

}
function deleteAccount(){

let confirmDelete =
confirm("Do you really want to delete your account?");


if(!confirmDelete){
return;
}


let users =
JSON.parse(localStorage.getItem("users")) || [];


let newUsers =
users.filter(u=>u.username!=currentUser);



localStorage.setItem(
"users",
JSON.stringify(newUsers)
);



currentUser=null;

localStorage.removeItem("currentUser");


alert("Account Deleted Successfully");


show("login");


}
// UPDATE DASHBOARD

function update(){

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(user){

document.getElementById("welcome").innerHTML =
"Welcome " + user.username;

document.getElementById("balance").innerHTML =
"₹" + user.balance;

}

}

// DEPOSIT

function deposit(){

let amount =
Number(document.getElementById("depositAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(amount>0){

user.balance += amount;

if(!user.transactions){

user.transactions=[];

}

user.transactions.push({

type:"Deposit",

from:"Bank",

to:user.username,

amount:amount,

balance:user.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("depositAmount").value="";

update();

alert("Money Deposited Successfully");

}
else{

alert("Enter Valid Amount");

}

}

// WITHDRAW

function withdraw(){

let amount =
Number(document.getElementById("withdrawAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(amount>0 && amount<=user.balance){

user.balance -= amount;

if(!user.transactions){

user.transactions=[];

}

user.transactions.push({

type:"Withdraw",

from:user.username,

to:"Cash",

amount:amount,

balance:user.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("withdrawAmount").value="";

update();

alert("Withdraw Successful");

}
else{

alert("Insufficient Balance");

}

}

// TRANSFER

function transfer(){

let receiver =
document.getElementById("receiver").value;

let amount =
Number(document.getElementById("transferAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let sender =
users.find(u=>u.username==currentUser);

let receiverUser =
users.find(u=>u.username==receiver);

if(!receiverUser){

alert("Receiver Not Found");
return;

}

if(amount<=0 || amount>sender.balance){

alert("Invalid Amount");
return;

}

if(!sender.transactions){

sender.transactions=[];

}

if(!receiverUser.transactions){

receiverUser.transactions=[];

}

sender.balance -= amount;

receiverUser.balance += amount;

// Sender History

sender.transactions.push({

type:"Money Sent",

from:sender.username,

to:receiverUser.username,

amount:amount,

balance:sender.balance,

date:new Date().toLocaleString()

});

// Receiver History

receiverUser.transactions.push({

type:"Money Received",

from:sender.username,

to:receiverUser.username,

amount:amount,

balance:receiverUser.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("receiver").value="";
document.getElementById("transferAmount").value="";

update();

alert("Transfer Successful");

}
// TRANSACTION HISTORY

function loadHistory(){

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

let box =
document.getElementById("historyData");

box.innerHTML = "";

if(!user || !user.transactions || user.transactions.length==0){

box.innerHTML =
"<h3 style='text-align:center;'>No Transaction Found</h3>";

return;

}

let history =
[...user.transactions].reverse();

history.forEach(t=>{

box.innerHTML += `

<div class="transaction">

<div class="transaction-title">
    ${t.type}
</div>

<div>
    <b>From:</b><br>
    ${t.from}
</div>

<div>
    <b>To:</b><br>
    ${t.to}
</div>

<div>
    <b>Amount:</b><br>
    ₹${t.amount}
</div>

<div>
    <b>Balance:</b><br>
    ₹${t.balance}
</div>

<div>
    <b>Date:</b><br>
    ${t.date}
</div>

</div>

`;

});

}

// LOGOUT

function logout(){

currentUser = null;

localStorage.removeItem("currentUser");

show("login");

}

// AUTO LOGIN

window.onload = function(){

if(currentUser){

show("dashboard");

}

}

// ================================
// SHARE QR IMAGE
// ================================

async function shareQR(){

    try{

        const response = await fetch("qr.png");

        const blob = await response.blob();

        const file = new File(
            [blob],
            "SmartBank-QR.png",
            {
                type: "image/png"
            }
        );

        // Mobile / browser file sharing
        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                title:"Smart Bank QR Code",

                text:"Scan this QR code for Smart Bank.",

                files:[file]

            });

        }
        else{

            // If direct image sharing isn't supported
            const url = URL.createObjectURL(blob);

            const link = document.createElement("a");

            link.href = url;
            link.download = "SmartBank-QR.png";

            document.body.appendChild(link);

            link.click();

            document.body.removeChild(link);

            URL.revokeObjectURL(url);

            alert(
                "QR code downloaded successfully. " +
                "Now you can share it on WhatsApp or any other app."
            );
        }

    }
    catch(error){

        console.error(error);

        alert("QR Code can not be shared.");

    }
}
