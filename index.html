<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title> Smart Bank</title>

<style>
/* ================================
   RESET
================================ */

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:Arial,sans-serif;
}


/* ================================
   BODY
================================ */

body{
    background:linear-gradient(135deg,#1e3c72,#2a5298);
    min-height:100vh;
    display:flex;
    justify-content:center;
    align-items:center;
}


/* ================================
   MAIN CONTAINER
   Normal pages = 420px
================================ */

.container{
    width:420px;
    max-width:95%;
    background:#fff;
    padding:25px;
    border-radius:15px;
    box-shadow:0 0 20px rgba(0,0,0,.3);
}


/* ================================
   ONLY TRANSACTION HISTORY BIG
================================ */

.container:has(#history.active){
    width:95%;
    max-width:1200px;
}


/* ================================
   PAGES
================================ */

.page{
    display:none;
}

.active{
    display:block;
}


/* ================================
   HEADINGS
================================ */

h2{
    text-align:center;
    color:#1e3c72;
    margin-bottom:20px;
}


/* ================================
   INPUTS
================================ */

input{
    width:100%;
    padding:12px;
    margin:8px 0;
    border:1px solid #ccc;
    border-radius:8px;
    font-size:15px;
}


/* ================================
   BUTTONS
================================ */

button{
    width:100%;
    padding:12px;
    margin-top:10px;
    background:#1e3c72;
    color:white;
    border:none;
    border-radius:8px;
    cursor:pointer;
    font-size:16px;
}

button:hover{
    background:#2a5298;
}


/* ================================
   GREEN BUTTON
================================ */

.linkBtn{
    background:#28a745;
}

.linkBtn:hover{
    background:#1f8b39;
}


/* ================================
   BALANCE CARD
================================ */

.card{
    background:#1e3c72;
    color:white;
    padding:20px;
    border-radius:12px;
    margin:20px 0;
    text-align:center;
}


/* ================================
   TRANSACTION HISTORY
================================ */

#history{
    width:100%;
}

#historyData{
    width:100%;

    /* 4 TRANSACTIONS IN ONE ROW */
    display:grid;
    grid-template-columns:repeat(4,1fr);

    gap:15px;
}


/* ================================
   EACH TRANSACTION BOX
================================ */

#historyData .transaction{
    width:100%;
    background:#f2f2f2;
    padding:15px;
    margin:0;
    border-radius:8px;
    line-height:25px;

    display:block;

    border:1px solid #e0e0e0;
}


/* ================================
   TRANSACTION TITLE
================================ */

.transaction .transaction-title{
    font-weight:bold;
    font-size:17px;
    color:#1e3c72;

    border-bottom:1px solid #ddd;

    padding-bottom:7px;
    margin-bottom:10px;
}


/* ================================
   QR SCANNER
================================ */

#reader{
    width:100%;
    max-width:350px;
    margin:15px auto;
    overflow:hidden;
    border-radius:12px;
}

#reader video{
    width:100% !important;
    border-radius:12px;
}


/* ================================
   SCAN RESULT
================================ */

#scanResult{
    text-align:center;
    margin:15px 0;
    font-weight:bold;
    color:#1e3c72;
}


/* ================================
   MOBILE
================================ */

@media(max-width:600px){

    body{
        padding:10px;
    }

    .container{
        width:95%;
        max-width:95%;
        padding:15px;
    }

    /* History still bigger than normal content */
    .container:has(#history.active){
        width:95%;
        max-width:95%;
    }

    /* 2 TRANSACTION BOXES PER ROW */
    #historyData{
        grid-template-columns:repeat(2,1fr);
        gap:10px;
    }

    #historyData .transaction{
        padding:12px;
        font-size:14px;
    }

}


/* ================================
   VERY SMALL MOBILE
================================ */

@media(max-width:400px){

    #historyData{
        grid-template-columns:1fr;
    }

}

/* ================================
   QR CODE
================================ */

.qr-box{
    width:100%;
    display:flex;
    justify-content:center;
    align-items:center;
    padding:10px;
}

.qr-box img{
    width:300px;
    max-width:100%;
    height:auto;
    display:block;
    border-radius:8px;
}
</style>
</head>

<body>

<div class="container">

<!-- LOGIN -->

<div id="login" class="page active">

<h2>🏦 Smart Bank Login</h2>



<input id="user" placeholder="Username">

<!-- <input id="phone" placeholder="Phone Number">

<input id="email" type="email" placeholder="Gmail"> -->

<input id="pass" type="password" placeholder="Password">

<button onclick="login()">Login</button>

<button class="linkBtn" onclick="signup()">
Create Account
</button>

<button onclick="forgotPassword()">
Forgot Password
</button>

</div>

<!-- CREATE ACCOUNT PAGE -->

<div id="signup" class="page">

<h2>🏦 Create Account</h2>

<input id="newUsername" placeholder="Create Username">

<input id="newPassword" type="password" placeholder="Create Password">

<input id="newPhone" placeholder="Phone Number">

<input id="newEmail" type="email" placeholder="Gmail">

<input id="newBalance" type="number" placeholder="Starting Balance">


<button onclick="createAccount()">
Create Account
</button>


<button onclick="show('login')">
Back To Login
</button>


</div>

<!-- DASHBOARD -->

<div id="dashboard" class="page">

<h2>🏦 Dashboard</h2>

<h3 id="welcome"></h3>

<div class="card">

<h3>Available Balance</h3>

<h1 id="balance">₹0</h1>

</div>

<button onclick="show('deposit')">
Deposit Money
</button>

<button onclick="show('withdraw')">
Withdraw Money
</button>

<button onclick="show('transfer')">
Transfer Money
</button>

<button onclick="show('qrScanner')">
    📷 QR Code
</button>

<button onclick="show('history')">
Transaction History
</button>

<button onclick="logout()">
Logout
</button>

<button onclick="deleteAccount()">
Delete Account
</button>

</div>


<!-- QR CODE PAGE -->

<div id="qrScanner" class="page">

    <h2>📷 Smart Bank QR</h2>

    <div class="qr-box">

        <img
            id="bankQR"
            src="qr.jpeg"
            alt="Smart Bank QR Code"
        >

    </div>

    <button onclick="shareQR()" class="linkBtn">
        📤 Share QR Code
    </button>

    <button onclick="show('dashboard')">
        ← Back To Dashboard
    </button>

</div>
<!-- DEPOSIT -->

<div id="deposit" class="page">

<h2>Deposit Money</h2>

<input
id="depositAmount"
type="number"
placeholder="Enter Amount">

<button onclick="deposit()">
Deposit
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- WITHDRAW -->

<div id="withdraw" class="page">

<h2>Withdraw Money</h2>

<input
id="withdrawAmount"
type="number"
placeholder="Enter Amount">

<button onclick="withdraw()">
Withdraw
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- TRANSFER -->

<div id="transfer" class="page">

<h2>Transfer Money</h2>

<input
id="receiver"
placeholder="Receiver Username">

<input
id="transferAmount"
type="number"
placeholder="Enter Amount">

<button onclick="transfer()">
Send Money
</button>

<button onclick="show('dashboard')">
Back
</button>

</div>

<!-- HISTORY -->

<div id="history" class="page">

<h2>Transaction History</h2>

<div id="historyData"></div>

<button onclick="show('dashboard')">
Back
</button>

</div>

</div>

<script>

let currentUser =
localStorage.getItem("currentUser");

function show(id){

    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById(id).classList.add("active");

    if(currentUser){
        update();
    }

    if(id === "history"){
        loadHistory();
    }
}


// CREATE ACCOUNT
function signup(){

show("signup");

}

async function createAccount(){

    let username =
        document.getElementById("newUsername").value.trim();

    let password =
        document.getElementById("newPassword").value;

    let phone =
        document.getElementById("newPhone").value.trim();

    let email =
        document.getElementById("newEmail").value.trim();

    let balance =
        Number(document.getElementById("newBalance").value);

    if(
        !username ||
        !password ||
        !phone ||
        !email ||
        isNaN(balance) ||
        balance < 0
    ){
        alert("Please Fill All Details");
        return;
    }

    try{

        const { doc, getDoc, setDoc } =
            window.firebaseFunctions;

        const userRef =
            doc(window.db, "users", username);

        const userSnap =
            await getDoc(userRef);

        if(userSnap.exists()){
            alert("Username Already Exists");
            return;
        }

        await setDoc(userRef, {

            username: username,
            password: password,
            phone: phone,
            email: email,
            balance: balance,
            transactions: [],
            createdAt: new Date().toISOString()

        });

        alert("Account Created Successfully!");

        document.getElementById("newUsername").value = "";
        document.getElementById("newPassword").value = "";
        document.getElementById("newPhone").value = "";
        document.getElementById("newEmail").value = "";
        document.getElementById("newBalance").value = "";

        show("login");

    }
    catch(error){

        console.error(error);

        alert(
            "Account creation failed: " +
            error.message
        );

    }
}

//login
async function login(){

    let username =
        document.getElementById("user").value.trim();

    let password =
        document.getElementById("pass").value;

    if(!username || !password){
        alert("Please enter username and password");
        return;
    }

    try{

        const { doc, getDoc } =
            window.firebaseFunctions;

        // Firebase se user find karo
        const userRef =
            doc(window.db, "users", username);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){
            alert("User Not Found");
            return;
        }

        const user =
            userSnap.data();

        // Password check
        if(user.password !== password){
            alert("Invalid Password");
            return;
        }

        // Login successful
        currentUser = username;

        localStorage.setItem(
            "currentUser",
            username
        );

        // Login inputs clear
        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";

        show("dashboard");

    }
    catch(error){

        console.error(error);

        alert(
            "Login failed: " +
            error.message
        );

    }

}
// forget paaaword 
async function forgotPassword(){

    let username =
        prompt("Enter your Username");

    if(!username){
        return;
    }

    let phone =
        prompt("Enter your Phone Number");

    if(!phone){
        return;
    }

    let email =
        prompt("Enter your Gmail");

    if(!email){
        return;
    }

    try{

        const {
            doc,
            getDoc,
            updateDoc
        } = window.firebaseFunctions;


        // Firebase user document
        const userRef =
            doc(window.db, "users", username);

        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            alert("User Not Found");
            return;

        }


        const user =
            userSnap.data();


        // Phone + Email verify
        if(
            user.phone !== phone ||
            user.email !== email
        ){

            alert("Phone Number or Gmail does not match");
            return;

        }


        let newPassword =
            prompt("Enter New Password");


        if(!newPassword){

            alert("Password cannot be empty");
            return;

        }


        // Update password in Firebase
        await updateDoc(userRef, {

            password: newPassword

        });


        alert("Password Changed Successfully!");


        // Login fields clear
        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";

    }
    catch(error){

        console.error(error);

        alert(
            "Password reset failed: " +
            error.message
        );

    }

}
//logout
function logout(){

    currentUser = null;

    localStorage.removeItem("currentUser");

    // Dashboard data clear
    document.getElementById("welcome").innerHTML = "";
    document.getElementById("balance").innerHTML = "₹0";

    // Login page show
    document.querySelectorAll(".page").forEach(page=>{
        page.classList.remove("active");
    });

    document.getElementById("login").classList.add("active");
}
// UPDATE DASHBOARD

async function update(){

    if(!currentUser) return;

    try{

        const { doc, getDoc } =
            window.firebaseFunctions;

        const userRef =
            doc(window.db, "users", currentUser);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()) return;

        const user = userSnap.data();

        document.getElementById("welcome").innerHTML =
            "Welcome " + user.username;

        document.getElementById("balance").innerHTML =
            "₹" + user.balance;

    }
    catch(error){

        console.error("Dashboard update failed:", error);

    }

}

// deposit

async function deposit(){

    let amount =
        Number(document.getElementById("depositAmount").value);

    if(amount <= 0){
        alert("Enter Valid Amount");
        return;
    }

    try{

        const {
            doc,
            getDoc,
            updateDoc
        } = window.firebaseFunctions;

        const userRef =
            doc(window.db, "users", currentUser);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){
            alert("User Not Found");
            return;
        }

        const user = userSnap.data();

        let newBalance =
            Number(user.balance) + amount;

        let transactions =
            user.transactions || [];

        transactions.push({

            type: "Deposit",
            from: "Bank",
            to: user.username,
            amount: amount,
            balance: newBalance,
            date: new Date().toLocaleString()

        });

        await updateDoc(userRef, {

            balance: newBalance,
            transactions: transactions

        });

        // Input clear
        document.getElementById("depositAmount").value = "";

        // Dashboard balance update
        document.getElementById("balance").innerHTML =
            "₹" + newBalance;

        alert("Money Deposited Successfully");

    }
    catch(error){

        console.error(error);

        alert(
            "Deposit failed: " +
            error.message
        );

    }

}
// WITHDRAW

async function withdraw(){

    let amount =
        Number(document.getElementById("withdrawAmount").value);

    if(amount <= 0){
        alert("Enter Valid Amount");
        return;
    }

    try{

        const {
            doc,
            getDoc,
            updateDoc
        } = window.firebaseFunctions;

        const userRef =
            doc(window.db, "users", currentUser);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){
            alert("User Not Found");
            return;
        }

        const user = userSnap.data();

        let currentBalance =
            Number(user.balance);

        // Balance check
        if(amount > currentBalance){
            alert("Insufficient Balance");
            return;
        }

        let newBalance =
            currentBalance - amount;

        let transactions =
            user.transactions || [];

        transactions.push({

            type: "Withdraw",
            from: user.username,
            to: "Cash",
            amount: amount,
            balance: newBalance,
            date: new Date().toLocaleString()

        });

        await updateDoc(userRef, {

            balance: newBalance,
            transactions: transactions

        });

        // Input clear
        document.getElementById("withdrawAmount").value = "";

        // Dashboard balance update
        document.getElementById("balance").innerHTML =
            "₹" + newBalance;

        alert("Withdraw Successful");

    }
    catch(error){

        console.error(error);

        alert(
            "Withdraw failed: " +
            error.message
        );

    }

}

// TRANSFER

async function transfer(){

    let receiver =
        document.getElementById("receiver").value.trim();

    let amount =
        Number(document.getElementById("transferAmount").value);

    if(!receiver || amount <= 0){
        alert("Enter valid receiver and amount");
        return;
    }

    if(receiver === currentUser){
        alert("You cannot transfer money to yourself");
        return;
    }

    try{

        const {
            doc,
            getDoc,
            updateDoc
        } = window.firebaseFunctions;


        // Sender
        const senderRef =
            doc(window.db, "users", currentUser);

        const senderSnap =
            await getDoc(senderRef);

        if(!senderSnap.exists()){
            alert("Sender account not found");
            return;
        }

        const sender =
            senderSnap.data();


        // Receiver
        const receiverRef =
            doc(window.db, "users", receiver);

        const receiverSnap =
            await getDoc(receiverRef);

        if(!receiverSnap.exists()){
            alert("Receiver Not Found");
            return;
        }

        const receiverUser =
            receiverSnap.data();


        // Balance check
        if(amount > Number(sender.balance)){
            alert("Insufficient Balance");
            return;
        }


        // New balances
        const senderBalance =
            Number(sender.balance) - amount;

        const receiverBalance =
            Number(receiverUser.balance) + amount;


        // Sender transactions
        let senderTransactions =
            sender.transactions || [];

        senderTransactions.push({

            type: "Money Sent",

            from: sender.username,

            to: receiverUser.username,

            amount: amount,

            balance: senderBalance,

            date: new Date().toLocaleString()

        });


        // Receiver transactions
        let receiverTransactions =
            receiverUser.transactions || [];

        receiverTransactions.push({

            type: "Money Received",

            from: sender.username,

            to: receiverUser.username,

            amount: amount,

            balance: receiverBalance,

            date: new Date().toLocaleString()

        });


        // Update Sender
        await updateDoc(senderRef, {

            balance: senderBalance,

            transactions: senderTransactions

        });


        // Update Receiver
        await updateDoc(receiverRef, {

            balance: receiverBalance,

            transactions: receiverTransactions

        });


        // Clear inputs
        document.getElementById("receiver").value = "";

        document.getElementById("transferAmount").value = "";


        // Dashboard update
        document.getElementById("balance").innerHTML =
            "₹" + senderBalance;


        alert("Transfer Successful");


    }
    catch(error){

        console.error(error);

        alert(
            "Transfer failed: " +
            error.message
        );

    }

}
// TRANSACTION HISTORY

async function loadHistory(){

    if(!currentUser) return;

    let box =
        document.getElementById("historyData");

    box.innerHTML = "Loading...";

    try{

        const {
            doc,
            getDoc
        } = window.firebaseFunctions;

        const userRef =
            doc(window.db, "users", currentUser);

        const userSnap =
            await getDoc(userRef);

        if(!userSnap.exists()){

            box.innerHTML =
                "<h3 style='text-align:center;'>User Not Found</h3>";

            return;
        }

        const user =
            userSnap.data();

        let transactions =
            user.transactions || [];

        box.innerHTML = "";

        if(transactions.length === 0){

            box.innerHTML =
                "<h3 style='text-align:center;'>No Transaction Found</h3>";

            return;
        }

        // Latest transaction first
        let history =
            [...transactions].reverse();

        history.forEach(t => {

            box.innerHTML += `

            <div class="transaction">

                <div class="transaction-title">
                    ${t.type}
                </div>

                <div>
                    <b>From:</b><br>
                    ${t.from}
                </div>

                <div>
                    <b>To:</b><br>
                    ${t.to}
                </div>

                <div>
                    <b>Amount:</b><br>
                    ₹${t.amount}
                </div>

                <div>
                    <b>Balance:</b><br>
                    ₹${t.balance}
                </div>

                <div>
                    <b>Date:</b><br>
                    ${t.date}
                </div>

            </div>

            `;

        });

    }
    catch(error){

        console.error(error);

        box.innerHTML =
            "<h3 style='text-align:center;'>Failed to load history</h3>";

    }

}

// ================================
// SHARE QR IMAGE
// ================================

async function shareQR(){

    try{

        const response = await fetch("qr.jpeg");

        const blob = await response.blob();

        const file = new File(
            [blob],
            "SmartBank-QR.jpeg",
            {
                type: blob.type
            }
        );

        if(
            navigator.share &&
            navigator.canShare &&
            navigator.canShare({
                files:[file]
            })
        ){

            await navigator.share({

                title:"Smart Bank QR Code",

                text:"Scan my Smart Bank QR Code",

                files:[file]

            });

        }else{

            alert(
                "This browser does not support direct image sharing."
            );

        }

    }catch(error){

        console.log(error);

        alert("Failed to share the QR code .");

    }

}

//delete account
async function deleteAccount(){

    let confirmDelete =
        confirm("Do you really want to delete your account?");

    if(!confirmDelete){
        return;
    }

    try{

        const {
            doc,
            getDoc,
            deleteDoc
        } = window.firebaseFunctions;


        const userRef =
            doc(window.db, "users", currentUser);


        const userSnap =
            await getDoc(userRef);


        if(!userSnap.exists()){

            alert("Account Not Found");
            return;

        }


        await deleteDoc(userRef);


        // Current user clear
        currentUser = null;

        localStorage.removeItem("currentUser");


        // Login inputs clear
        document.getElementById("user").value = "";
        document.getElementById("pass").value = "";


        alert("Account Deleted Successfully");


        show("login");

    }
    catch(error){

        console.error(error);

        alert(
            "Account deletion failed: " +
            error.message
        );

    }

}
