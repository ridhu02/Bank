localStorage.getItem("currentUser");

function show(id){

document.querySelectorAll(".page")
.forEach(page=>{
page.classList.remove("active");
});

document.getElementById(id)
.classList.add("active");

update();

if(id=="history"){
loadHistory();
}

}

// CREATE ACCOUNT
function signup(){

show("signup");

}



function createAccount(){


let username =
document.getElementById("newUsername").value;


let password =
document.getElementById("newPassword").value;


let phone =
document.getElementById("newPhone").value;


let email =
document.getElementById("newEmail").value;


let balance =
Number(document.getElementById("newBalance").value);



if(
!username ||
!password ||
!phone ||
!email ||
isNaN(balance) ||
balance < 0
){

alert("Please Fill All Details");
return;

}



let users =
JSON.parse(localStorage.getItem("users")) || [];



if(users.find(u=>u.username==username)){

alert("Username Already Exists");
return;

}



users.push({

username,
password,
phone,
email,
balance,

transactions:[]

});



localStorage.setItem(
"users",
JSON.stringify(users)
);



alert("Account Created Successfully");


// clear form

document.getElementById("newUsername").value="";
document.getElementById("newPassword").value="";
document.getElementById("newPhone").value="";
document.getElementById("newEmail").value="";
document.getElementById("newBalance").value="";


show("login");


}
// LOGIN
function login(){

    let username = document.getElementById("user").value;
    //let phone = document.getElementById("phone").value;
    // let email = document.getElementById("email").value;
    let password = document.getElementById("pass").value;

    let users = JSON.parse(localStorage.getItem("users")) || [];

    let user = users.find(u =>
        u.username === username &&
        // u.phone === phone &&
        // u.email === email &&
        u.password === password
    );

    if(user){

        currentUser = username;

        localStorage.setItem("currentUser", username);

        // Inputs clear
        document.getElementById("user").value = "";
        // document.getElementById("phone").value = "";
        // document.getElementById("email").value = "";
        document.getElementById("pass").value = "";

        show("dashboard");

    }else{

        alert("Invalid details.");

    }

}
function deleteAccount(){

let confirmDelete =
confirm("Do you really want to delete your account?");


if(!confirmDelete){
return;
}


let users =
JSON.parse(localStorage.getItem("users")) || [];


let newUsers =
users.filter(u=>u.username!=currentUser);



localStorage.setItem(
"users",
JSON.stringify(newUsers)
);



currentUser=null;

localStorage.removeItem("currentUser");


alert("Account Deleted Successfully");


show("login");


}
// UPDATE DASHBOARD

function update(){

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(user){

document.getElementById("welcome").innerHTML =
"Welcome " + user.username;

document.getElementById("balance").innerHTML =
"₹" + user.balance;

}

}

// DEPOSIT

function deposit(){

let amount =
Number(document.getElementById("depositAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(amount>0){

user.balance += amount;

if(!user.transactions){

user.transactions=[];

}

user.transactions.push({

type:"Deposit",

from:"Bank",

to:user.username,

amount:amount,

balance:user.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("depositAmount").value="";

update();

alert("Money Deposited Successfully");

}
else{

alert("Enter Valid Amount");

}

}

// WITHDRAW

function withdraw(){

let amount =
Number(document.getElementById("withdrawAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

if(amount>0 && amount<=user.balance){

user.balance -= amount;

if(!user.transactions){

user.transactions=[];

}

user.transactions.push({

type:"Withdraw",

from:user.username,

to:"Cash",

amount:amount,

balance:user.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("withdrawAmount").value="";

update();

alert("Withdraw Successful");

}
else{

alert("Insufficient Balance");

}

}

// TRANSFER

function transfer(){

let receiver =
document.getElementById("receiver").value;

let amount =
Number(document.getElementById("transferAmount").value);

let users =
JSON.parse(localStorage.getItem("users")) || [];

let sender =
users.find(u=>u.username==currentUser);

let receiverUser =
users.find(u=>u.username==receiver);

if(!receiverUser){

alert("Receiver Not Found");
return;

}

if(amount<=0 || amount>sender.balance){

alert("Invalid Amount");
return;

}

if(!sender.transactions){

sender.transactions=[];

}

if(!receiverUser.transactions){

receiverUser.transactions=[];

}

sender.balance -= amount;

receiverUser.balance += amount;

// Sender History

sender.transactions.push({

type:"Money Sent",

from:sender.username,

to:receiverUser.username,

amount:amount,

balance:sender.balance,

date:new Date().toLocaleString()

});

// Receiver History

receiverUser.transactions.push({

type:"Money Received",

from:sender.username,

to:receiverUser.username,

amount:amount,

balance:receiverUser.balance,

date:new Date().toLocaleString()

});

localStorage.setItem(
"users",
JSON.stringify(users)
);

document.getElementById("receiver").value="";
document.getElementById("transferAmount").value="";

update();

alert("Transfer Successful");

}
// TRANSACTION HISTORY

function loadHistory(){

let users =
JSON.parse(localStorage.getItem("users")) || [];

let user =
users.find(u=>u.username==currentUser);

let box =
document.getElementById("historyData");

box.innerHTML = "";

if(!user || !user.transactions || user.transactions.length==0){

box.innerHTML =
"<h3 style='text-align:center;'>No Transaction Found</h3>";

return;

}

let history =
[...user.transactions].reverse();

history.forEach(t=>{

box.innerHTML += `

<div class="transaction">

<b>${t.type}</b><br><br>

<b>From :</b> ${t.from}<br>

<b>To :</b> ${t.to}<br>

<b>Amount :</b> ₹${t.amount}<br>

<b>Remaining Balance :</b> ₹${t.balance}<br>

<b>Date :</b> ${t.date}

</div>

`;

});

}

// LOGOUT

function logout(){

currentUser = null;

localStorage.removeItem("currentUser");

show("login");

}

// AUTO LOGIN

window.onload = function(){

if(currentUser){

show("dashboard");

}

}

</script>
